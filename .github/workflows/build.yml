name: Build APK

on:
  push:
    # '**' 匹配所有分支但不含 tag —— tag 推送交给 release.yml，避免同一次推送跑两遍。
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        run: |
          ver=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      # upload-artifact 的 name 只决定下载下来那个 zip 叫什么，zip 里的文件名它不会动 ——
      # 所以必须先把 app-debug.apk 自己改名，否则解压出来还是 app-debug.apk。
      - name: Name the APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             "NotifyGuard-Alpha-v${APP_VERSION}-r${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          # 故意不带 .apk 后缀：下载得到的是 zip，名字里再挂个 .apk 容易让人以为下错东西。
          name: NotifyGuard-Alpha-v${{ env.APP_VERSION }}-r${{ github.run_number }}
          path: NotifyGuard-Alpha-v${{ env.APP_VERSION }}-r${{ github.run_number }}.apk
